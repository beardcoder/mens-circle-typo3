<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="newsletter-form content-element">
    <f:if condition="{data.header}">
        <h2>{data.header}</h2>
    </f:if>
    
    <f:if condition="{data.bodytext}">
        <div class="form-description">
            {data.bodytext -> f:format.html()}
        </div>
    </f:if>
    
    <form action="/newsletter/subscribe" method="post" data-ajax="true" class="newsletter-subscription-form">
        <div class="form-group">
            <label for="newsletter-name">Name (optional)</label>
            <input 
                type="text" 
                id="newsletter-name" 
                name="name" 
                placeholder="Ihr Name"
            />
        </div>
        
        <div class="form-group">
            <label for="newsletter-email">E-Mail *</label>
            <input 
                type="email" 
                id="newsletter-email" 
                name="email" 
                required 
                placeholder="ihre@email.de"
            />
        </div>
        
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="privacy" required />
                Ich habe die <a href="/datenschutz" target="_blank">Datenschutzerklärung</a> gelesen und akzeptiert.
            </label>
        </div>
        
        <button type="submit" class="button">Newsletter abonnieren</button>
        
        <p class="form-note">
            Nach der Anmeldung erhalten Sie eine Bestätigungs-E-Mail. 
            Bitte klicken Sie auf den Link in dieser E-Mail, um Ihre Anmeldung abzuschließen.
        </p>
    </form>
</div>

</html>
