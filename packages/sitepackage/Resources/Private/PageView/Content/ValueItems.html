<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:section name="Main">
    <section class="section section--values" id="values-{data.uid}">
        <div class="container">
            <f:if condition="{data.header}">
                <header class="section-header">
                    <f:if condition="{data.subheader}">
                        <p class="section-header__eyebrow">{data.subheader}</p>
                    </f:if>
                    <h2 class="section-header__title">{data.header}</h2>
                </header>
            </f:if>

            <f:if condition="{data.tx_sitepackage_value_items}">
                <div class="value-items">
                    <f:for each="{data.tx_sitepackage_value_items}" as="item">
                        <div class="value-item">
                            <f:if condition="{item.icon}">
                                <div class="value-item__icon">{item.icon}</div>
                            </f:if>
                            <h3 class="value-item__title">{item.title}</h3>
                            <p class="value-item__description">{item.description -> f:format.nl2br()}</p>
                        </div>
                    </f:for>
                </div>
            </f:if>
        </div>
    </section>
</f:section>
</html>
