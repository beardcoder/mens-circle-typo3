<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:section name="Main">
    <section class="section section--faq" id="faq-{data.uid}">
        <div class="container">
            <f:if condition="{data.header}">
                <header class="section-header">
                    <f:if condition="{data.subheader}">
                        <p class="section-header__eyebrow">{data.subheader}</p>
                    </f:if>
                    <h2 class="section-header__title">{data.header}</h2>
                    <f:if condition="{data.bodytext}">
                        <p class="section-header__subtitle">{data.bodytext}</p>
                    </f:if>
                </header>
            </f:if>

            <f:if condition="{data.tx_sitepackage_faq_items}">
                <div class="faq__list">
                    <f:for each="{data.tx_sitepackage_faq_items}" as="item">
                        <details class="faq-item">
                            <summary class="faq-item__question">
                                {item.question}
                                <span class="faq-item__icon" aria-hidden="true">+</span>
                            </summary>
                            <div class="faq-item__answer">
                                <f:format.html>{item.answer}</f:format.html>
                            </div>
                        </details>
                    </f:for>
                </div>
            </f:if>
        </div>
    </section>
</f:section>
</html>
