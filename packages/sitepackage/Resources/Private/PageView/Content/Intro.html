<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:section name="Main">
    <section class="section section--intro" id="intro-{data.uid}">
        <div class="container">
            <div class="intro__layout">
                <div class="intro__content">
                    <f:if condition="{data.header}">
                        <header class="section-header">
                            <f:if condition="{data.subheader}">
                                <p class="section-header__eyebrow">{data.subheader}</p>
                            </f:if>
                            <h2 class="section-header__title">{data.header}</h2>
                        </header>
                    </f:if>

                    <f:if condition="{data.bodytext}">
                        <div class="intro__text">
                            {data.bodytext -> f:format.nl2br()}
                        </div>
                    </f:if>

                    <f:if condition="{data.tx_sitepackage_intro_values}">
                        <div class="intro__values">
                            <f:for each="{data.tx_sitepackage_intro_values}" as="item">
                                <div class="intro-value">
                                    <div class="intro-value__number">{item.value}</div>
                                    <div class="intro-value__label">{item.label}</div>
                                </div>
                            </f:for>
                        </div>
                    </f:if>
                </div>

                <f:if condition="{data.tx_sitepackage_quote}">
                    <div class="intro__quote">
                        <blockquote class="quote">
                            {data.tx_sitepackage_quote -> f:format.nl2br()}
                        </blockquote>
                    </div>
                </f:if>
            </div>
        </div>
    </section>
</f:section>
</html>
