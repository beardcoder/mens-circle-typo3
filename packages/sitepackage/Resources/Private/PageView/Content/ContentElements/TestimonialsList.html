<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="testimonials-list content-element">
    <f:if condition="{data.header}">
        <h2>{data.header}</h2>
    </f:if>
    
    <f:if condition="{testimonials}">
        <f:then>
            <div class="testimonials">
                <f:for each="{testimonials}" as="testimonial">
                    <blockquote class="testimonial-item">
                        <div class="testimonial-content">
                            {testimonial.content -> f:format.nl2br()}
                        </div>
                        <footer class="testimonial-author">
                            <cite>— {testimonial.author_name}</cite>
                            <f:if condition="{testimonial.submitted_at}">
                                <time datetime="{f:format.date(date: testimonial.submitted_at, format: 'Y-m-d')}">
                                    {f:format.date(date: testimonial.submitted_at, format: 'F Y')}
                                </time>
                            </f:if>
                        </footer>
                    </blockquote>
                </f:for>
            </div>
        </f:then>
        <f:else>
            <p class="no-testimonials">Noch keine Erfahrungsberichte vorhanden.</p>
        </f:else>
    </f:if>
</div>

</html>
