<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="event-list content-element">
    <f:if condition="{data.header}">
        <h2>{data.header}</h2>
    </f:if>
    
    <f:if condition="{events}">
        <f:then>
            <div class="events">
                <f:for each="{events}" as="event">
                    <article class="event-item">
                        <h3>{event.title}</h3>
                        <div class="event-meta">
                            <f:if condition="{event.start_date}">
                                <time datetime="{f:format.date(date: event.start_date, format: 'Y-m-d')}">
                                    {f:format.date(date: event.start_date, format: 'd.m.Y H:i')} Uhr
                                </time>
                            </f:if>
                            <f:if condition="{event.location}">
                                <span class="location">{event.location}</span>
                            </f:if>
                        </div>
                        <f:if condition="{event.description}">
                            <div class="event-description">
                                {event.description -> f:format.html()}
                            </div>
                        </f:if>
                        <div class="event-capacity">
                            <f:if condition="{event.max_participants}">
                                <span>
                                    Plätze: {event.current_participants} / {event.max_participants}
                                    <f:if condition="{event.current_participants} >= {event.max_participants}">
                                        <strong class="full">(Ausgebucht)</strong>
                                    </f:if>
                                </span>
                            </f:if>
                        </div>
                    </article>
                </f:for>
            </div>
        </f:then>
        <f:else>
            <p class="no-events">Aktuell sind keine Veranstaltungen geplant.</p>
        </f:else>
    </f:if>
</div>

</html>
