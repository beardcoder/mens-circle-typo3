<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:section name="Main">
    <section class="section section--journey" id="journey-{data.uid}">
        <div class="container">
            <f:if condition="{data.header}">
                <header class="section-header">
                    <f:if condition="{data.subheader}">
                        <p class="section-header__eyebrow">{data.subheader}</p>
                    </f:if>
                    <h2 class="section-header__title">{data.header}</h2>
                    <f:if condition="{data.bodytext}">
                        <p class="section-header__subtitle">{data.bodytext}</p>
                    </f:if>
                </header>
            </f:if>

            <f:if condition="{data.tx_sitepackage_journey_steps}">
                <div class="journey__steps">
                    <f:for each="{data.tx_sitepackage_journey_steps}" as="step" iteration="iterator">
                        <div class="journey-step">
                            <div class="journey-step__number">{step.step_number -> f:if(condition: step.step_number, else: iterator.cycle)}</div>
                            <h3 class="journey-step__title">{step.title}</h3>
                            <p class="journey-step__description">{step.description -> f:format.nl2br()}</p>
                        </div>
                    </f:for>
                </div>
            </f:if>
        </div>
    </section>
</f:section>
</html>
