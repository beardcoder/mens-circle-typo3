services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  MensCircle\Sitepackage\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Controllers
  MensCircle\Sitepackage\Controller\:
    resource: '../Classes/Controller/*'
    public: true
    tags: ['backend.controller']

  # Repositories
  MensCircle\Sitepackage\Domain\Repository\:
    resource: '../Classes/Domain/Repository/*'
    public: true
